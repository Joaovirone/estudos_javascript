<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>operadores logicos</title>
</head>
<body>
    <h1>Operadores Lógicos</h1>
    <h3>Lógico && (e ou and)</h3>

    <script>
        var resposta = true && true;
        document.write(resposta + '<br>');
        
        resposta = false && false;
        document.write(resposta + '<br>');

        resposta = false && true;
        document.write(resposta + '<br>');

        resposta = false && (3 == 4);
        document.write(resposta + '<br>');

        resposta = 'Senac' && 'JavaScript';
        document.write(resposta + '<br>');

        resposta = false && 'Senac';
        document.write(resposta + '<br>');

        resposta = 'Senac' && false;
        document.write(resposta + '<br>');

        resposta = '' && false;
        document.write(resposta + '<br>');

        resposta = false && '';
        document.write(resposta + '<br>');

    </script>

    <h3>Lógico || (ou)</h3>
    
    <script>
        var resposta = true || true;
        document.write(resposta + '<br>');
        
        resposta = false || false;
        document.write(resposta + '<br>');

        resposta = false || true;
        document.write(resposta + '<br>');

        resposta = false || (3 == 4);
        document.write(resposta + '<br>');

        resposta = 'Senac' || 'JavaScript';
        document.write(resposta + '<br>');

        resposta = false || 'Senac';
        document.write(resposta + '<br>');

        resposta = 'Senac' || false;
        document.write(resposta + '<br>');

        resposta = '' || false;
        document.write(resposta + '<br>');
        
        resposta = false || '';
        document.write(resposta + '<br>');
    </script>

    <h3>Operador ! (not ou não)</h3>

    <script>
        var resposta = !true;
        document.write(resposta + '<br>');

        resposta = !false;
        document.write(resposta + '<br>');

        resposta = !'Senac';
        document.write(resposta + '<br>');

    </script>
    
</body>
</html>
